url: https://akilanthony.github.io/paweh/

template:
  bootstrap: 5
  math-rendering: mathml
  bslib:
    bg: "#ffffff"
    fg: "#202f40"
    primary: "#165a65"
    link-color: "#145967"
    link-hover-color: "#103c49"
    border-radius: "0.4rem"

home:
  sidebar: false
  description: "Estimate statistical power and sample size for genetic association studies before collecting data."

navbar:
  bg: light
  structure:
    left: [home, start, designs, methods, reference]
    right: [search, github]
  components:
    home:
      text: Home
      href: index.html
    start:
      text: Get Started
      href: articles/paweh-01-getting-started.html
    designs:
      text: Study Designs
      menu:
      - text: All articles
        href: articles/index.html
      - text: "-------"
      - text: Case-Control Studies
        href: articles/paweh-02-case-control-study-design.html
      - text: TDT / Family Studies
        href: articles/paweh-03-tdt-study-design.html
      - text: Quantitative Traits
        href: articles/paweh-04-quantitative-trait-study-design.html
      - text: Sequencing-Based Studies
        href: articles/paweh-06-sequencing-study-design.html
      - text: Validation-Based / LRTae Studies
        href: articles/paweh-07-lrtae-study-design.html
      - text: "-------"
      - text: Hardy–Weinberg Equilibrium
        href: articles/paweh-09-hwe-diagnostics.html
      - text: Interactive Dashboard
        href: articles/paweh-05-interactive-dashboard.html
    methods:
      text: Methods & Sources
      href: articles/paweh-08-methods-and-sources.html
    reference:
      text: Function Reference
      href: reference/index.html
    github:
      text: GitHub
      href: https://github.com/akilanthony/paweh

