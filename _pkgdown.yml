  - cc_chisq_power_genotype_misclassification_1p
  - cc_chisq_power_genotype_misclassification_2p
  - cc_chisq_power_genotype_misclassification_3p
  - cc_chisq_power_genotype_misclassification_differential_3p
  - cc_chisq_power_locus_heterogeneity
  - cc_chisq_power_phenotype_misclassification
  - cc_trend_mssn_locus_heterogeneity
  - cc_trend_power_locus_heterogeneity
- title: "TDT: Main Functions"
  desc: "Plan a transmission disequilibrium test with affected children and both parents."
- contents:
  - tdt_mssn
  - tdt_power
- title: "TDT: Specialized Calculations"
  desc: "Work with expected transmissions, genetic models and phenotype misclassification."
- contents:
  - tdt_expected_nontransmission_probability
  - tdt_expected_transmission_counts
  - tdt_expected_transmission_probability
