  - tdt_mssn_phenotype_misclassification_from_ncp
  - tdt_power_from_expected_counts
  - tdt_power_from_model
- title: "Quantitative Traits"
  desc: "Plan analyses of continuous traits, selected extremes and multiple correlated measurements."
- contents:
  - qtl_anova_mssn
  - qtl_anova_power
  - qtl_falconer_parameters
  - qtl_falconer_threshold_parameters
  - qtl_multivariate_mssn_full
  - qtl_multivariate_power_full
  - qtl_threshold_chisq_mssn
  - qtl_threshold_chisq_power
- title: "Sequencing"
  desc: "Compare sequencing depth and read error assumptions for case-control or trio designs."
- contents:
  - cc_ngs_mssn
  - cc_ngs_power
  - ngs_genotype_error_matrix
  - tdt_ngs_mssn
  - tdt_ngs_power
- title: "LRTae"
  desc: "Plan studies that verify diagnoses, genotypes or both in a subset of participants."
- contents:
  - lrtae_mssn
  - lrtae_ncp
  - lrtae_power
- title: "Hardy–Weinberg Equilibrium"
  desc: "Test observed counts or plan a study to detect a specified departure from equilibrium."
- contents:
  - hwe_test
  - hwe_power
  - hwe_mssn
- title: "Plotting and Visualization"
  desc: "Show design sensitivity, power, recruitment or genotype distributions."
- contents:
  - plot_cc_mssn
  - plot_cc_power
  - plot_ngs_mssn
  - plot_ngs_power
  - plot_qtl_anova_mssn
  - plot_qtl_anova_power
  - plot_qtl_genotype_distribution
  - plot_qtl_threshold_chisq_mssn
  - plot_qtl_threshold_chisq_power
  - plot_tdt_mssn
  - plot_tdt_mssn_locus_heterogeneity
  - plot_tdt_mssn_phenotype_misclassification
  - plot_tdt_power
  - plot_tdt_power_locus_heterogeneity
  - plot_tdt_power_phenotype_misclassification
  - plot_tdt_surface3d
- title: "Interactive Dashboard"
  desc: "Open the Shiny interface for case-control, trio and quantitative-trait designs."
- contents:
  - paweh_app
