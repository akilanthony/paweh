- title: Get started
  contents: paweh-01-getting-started
- title: Study design tutorials
  contents:
  - paweh-02-case-control-study-design
  - paweh-03-tdt-study-design
  - paweh-04-quantitative-trait-study-design
  - paweh-06-sequencing-study-design
  - paweh-07-lrtae-study-design
- title: Genotype diagnostics
  contents: paweh-09-hwe-diagnostics
- title: Interactive workflow
  contents: paweh-05-interactive-dashboard
- title: Scientific foundations
  contents: paweh-08-methods-and-sources

reference:
- title: "Case-Control: Main Functions"
  desc: "Estimate power and recruitment for unrelated cases and controls."
- contents:
  - cc_mssn
  - cc_power
- title: "Case-Control: Misclassification and Heterogeneity"
  desc: "Explore how errors and genetic mixtures change a planned comparison."
- contents:
  - cc_chisq_mssn_genotype_misclassification_1p
  - cc_chisq_mssn_genotype_misclassification_2p
  - cc_chisq_mssn_genotype_misclassification_3p
  - cc_chisq_mssn_genotype_misclassification_differential_3p
  - cc_chisq_mssn_locus_heterogeneity
